name: Sync from publish.fun
# The skill and the MCP server card are generated by publish.fun from the code
# that serves its API. This mirrors them daily (and on demand) and bumps the
# plugin version when they change, so nothing here is edited by hand.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/sync.py
      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "publishfun-sync"
            git config user.email "publishfun-sync@users.noreply.github.com"
            git add -A
            git commit -m "Sync agent files from publish.fun"
            git push
          fi

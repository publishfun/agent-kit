name: Sync from publish.fun
# The skill and the MCP server card are generated by publish.fun from the code
# that serves its API. This mirrors them daily (and on demand), bumps the
# version in every manifest when they change, and publishes a release, so
# nothing here is edited by hand.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/sync.py
      - name: Commit and release changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "publishfun-sync"
            git config user.email "publishfun-sync@users.noreply.github.com"
            git add -A
            git commit -m "Sync agent files from publish.fun"
            git push
            # Gemini CLI installs an extension from the repo's latest release, so
            # each change gets one. Never attach files to a release: Gemini CLI
            # would install a single attached file in place of the repo.
            v=$(python3 -c 'import json; print(json.load(open("gemini-extension.json"))["version"])')
            gh release create "v$v" --target "$(git rev-parse HEAD)" --title "v$v" \
              --notes "The skill and MCP server card as publish.fun served them on $(date -u +%Y-%m-%d)."
          fi
